<animate attributeName="fill" values="#00f0ff;#ff00e5;#00f0ff" dur="6s" repeatCount="indefinite"/>
</circle>
<rect x="395.0" y="9" width="10" height="10" fill="#00f0ff" transform="rotate(45 400.0 14)" opacity="0.9">
