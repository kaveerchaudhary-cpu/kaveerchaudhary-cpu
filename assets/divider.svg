<svg xmlns="http://www.w3.org/2000/svg" width="800" height="28" viewBox="0 0 800 28" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="0.25" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#ff00e5"/><stop offset="0.75" stop-color="#00f0ff"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
